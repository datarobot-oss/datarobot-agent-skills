---
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (default: the current branch)."
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: |
          uv build packages/datarobot-skills-utils --out-dir dist
          echo "Built datarobot-skills-utils $(uv version --project packages/datarobot-skills-utils --short)"

      # The package is versioned independently of the plugin, so most releases
      # re-build a version that is already on PyPI; skip-existing makes that a no-op.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
