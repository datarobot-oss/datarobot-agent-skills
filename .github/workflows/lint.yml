---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.301
      - name: Install gemini CLI
        run: npm install -g @google/gemini-cli@0.64.0
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.163.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.3"
      - name: Install go tools
        run: |
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
          go install github.com/apache/skywalking-eyes/cmd/license-eye@v0.9.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Install integration dependencies
        run: uv sync --locked --group integration
      - name: Run lint
        run: task lint
