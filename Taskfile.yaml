---
version: '3'

tasks:
  test:integration:
    desc: Validate all DataRobot skills (naming, structure, frontmatter)
    cmds:
      - uv run --group integration pytest tests/integration/ -v --tb=short

  ruff:check:
    desc: Run ruff linter on all Python scripts
    cmds:
      - uv run --group dev ruff check .

  ruff:format:
    desc: Run ruff formatter on all Python scripts
    cmds:
      - uv run --group dev ruff format .

  ruff:format:check:
    desc: Check if Python scripts are formatted correctly (CI mode)
    cmds:
      - uv run --group dev ruff format --check .

  shellcheck:
    desc: Run shellcheck on all shell scripts
    cmds:
      - find skills scripts -name '*.sh' -exec shellcheck {} +

  actionlint:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint

  zizmor:
    desc: Audit GitHub Actions workflows for security issues
    cmds:
      - uv run --group dev zizmor --offline --min-severity medium .github

  yamlfmt:
    desc: Format all YAML files with yamlfmt
    cmds:
      - yamlfmt .

  yamlfmt:check:
    desc: Check if YAML files are formatted correctly (CI mode)
    cmds:
      - yamlfmt -lint .

  mypy:
    desc: Run mypy type checker on Python scripts (override dir with DIR=<path>)
    vars:
      DIR: '{{.DIR | default "skills/ scripts/"}}'
    cmds:
      - uv run --group dev mypy {{.DIR}}

  license:check:
    desc: Check copyright headers on all code files
    cmds:
      - license-eye header check

  license:fix:
    desc: Add missing copyright headers to code files
    cmds:
      - license-eye header fix

  version:bump:
    desc: Bump the shared plugin version, rename CHANGELOG.md's Unreleased section, and commit
    cmds:
      - uv run scripts/version_bump.py {{.CLI_ARGS}}

  package:codex:
    desc: Build the public-upload DataRobot Codex plugin ZIP in dist/
    cmds:
      - uv run scripts/package_codex_plugin.py {{.CLI_ARGS}}

  lint:
    desc: Run all linting checks (validate skills + ruff + mypy + shellcheck + actionlint + zizmor + yamlfmt + license)
    deps:
      - test:integration
      - ruff:check
      - ruff:format:check
      - mypy
      - shellcheck
      - actionlint
      - zizmor
      - yamlfmt:check
      - license:check

  format:
    desc: Format all Python scripts and YAML files
    cmds:
      - task: ruff:format
      - task: yamlfmt

  default:
    desc: List all available tasks
    cmds:
      - task --list
