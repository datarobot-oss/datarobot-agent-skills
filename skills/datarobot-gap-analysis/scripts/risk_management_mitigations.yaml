---
# Assessment and remediation metadata for DataRobot risk-management's
# MitigationMethodType values (a stable, platform-defined enum). This is what
# drives Layer 4: whichever mitigations an org's live DataRobot risk-management
# policy requires are each assessed against the repo by an LLM (see
# prompts/risk-management-mitigation.md), and the unsatisfied ones become
# findings. Per type, this file supplies: what it means (title), how severe an
# unsatisfied requirement is (default_severity), whether the gap is structural
# (feeds the Patch/Hybrid/Re-platform posture), which DataRobot platform
# feature satisfies it, the remediation text shown in the report, what counts
# as evidence in a repo (evidence), and which files to show the LLM
# (files_glob; an empty list marks an organizational requirement that cannot
# be assessed from code at all).
#
# The remediation for nearly every mitigation type here is "adopt the DataRobot
# platform feature that provides this," not a code patch; a repo can still show
# pre-deployment evidence (its own implementation, or DataRobot deployment
# configuration that will provide the capability once deployed).
#
# `datarobot_feature` names are based on general knowledge of DataRobot's product
# surface (Model Registry documentation, deployment monitoring, GenAI Guards,
# RBAC), not verified against current product documentation or UI paths. Confirm
# the specific feature name/location before presenting this to a user as exact
# product guidance, DataRobot's own naming may have moved on.
#
# Grounded against DataRobot's built-in "EU AI Act" risk policy as of
# 2026-07-31. The risk-management API is not yet public, so DataRobot may add,
# rename, or retire mitigation types with no compatibility guarantee. Run
# validate_risk_management_mapping.py against a live GET /mitigationMethods/
# catalog before relying on this in production, it flags drift rather than
# letting this file silently go stale.

version: 1

mitigations:

  - mitigation_type: compliance_doc
    title: Technical documentation
    default_severity: medium
    structural: true
    datarobot_feature: DataRobot's Model Registry compliance documentation (automated documentation attached to a registered
      model)
    remediation: Register this system in DataRobot's Model Registry and generate its compliance documentation there, instead
      of maintaining a bespoke doc file.
    evidence: A substantive technical document or model card covering intended purpose, design, data, and capabilities/limits;
      or DataRobot Model Registry / automated-documentation configuration.
    files_glob: ["**/*.md", "**/docs/**", "**/MODEL_CARD*", "**/model_card*"]
    fix:
      via: api
      hint: "Generate automated compliance documentation for the registered model version (Model Registry API/console); no
        Pulumi resource."
    docs_topic: Generate compliance documentation
    steps:
      - "Register the model or LLM blueprint in the Model Registry (datarobot.RegisteredModel in Pulumi, or Registry, Register
        model in the console)."
      - "Open the registered model version, Compliance tab, and generate the automated compliance documentation; add the narrative
        sections the template asks for."
      - "Store the generated document with the Use Case risk assessment."

  - mitigation_type: deployment_logs
    title: Record-keeping and event logging
    default_severity: high
    structural: true
    datarobot_feature: DataRobot deployment prediction logging (automatic request/response logging on a registered deployment)
    remediation: Deploy this system through DataRobot so prediction logging is enabled by default, instead of building and
      maintaining custom logging.
    evidence: Structured application/event logging wired through the code paths that matter, or DataRobot deployment configuration
      that enables prediction logging.
    files_glob: ["**/*.py", "**/logging*", "**/infra/**", "**/metadata*.yaml", "**/__main__.py"]
    iac_evidence: a datarobot.Deployment (Pulumi) of a custom or external model provides prediction logging by construction
    fix:
      via: automatic
      hint: "Enabled by construction once the system is deployed through DataRobot (a datarobot.Deployment resource in Pulumi);
        no extra configuration."
    docs_topic: Configure data exploration
    steps:
      - "Deploy the model or LLM path through DataRobot: a datarobot.Deployment (backed by a RegisteredModel or CustomModel)
        in the Pulumi program."
      - "Nothing else to configure; review it under the deployment's Data exploration tab in Console."

  - mitigation_type: deployment_tracing
    title: Lifecycle tracing
    default_severity: medium
    structural: true
    datarobot_feature: DataRobot deployment tracing/observability
    remediation: Deploy through DataRobot (or instrument it with the datarobot-external-agent-monitoring skill) so traces
      are captured automatically.
    evidence: OpenTelemetry (or equivalent) tracing instrumentation, or DataRobot deployment/observability configuration that
      provides tracing.
    files_glob: ["**/*.py", "**/otel*", "**/tracing*", "**/telemetry*", "**/infra/**", "**/__main__.py"]
    iac_evidence: a datarobot.Deployment (Pulumi) of a custom or external model provides tracing by construction
    fix:
      via: automatic
      hint: "Enabled by construction once the system is deployed through DataRobot (a datarobot.Deployment resource in Pulumi);
        no extra configuration."
    docs_topic: Review tracing
    steps:
      - "Deploy through DataRobot; traces for LLM and agent deployments are collected through OpenTelemetry automatically."
      - "Export in-app spans to the deployment's OTel endpoint (OTEL_EXPORTER_OTLP_ENDPOINT, set by the Pulumi program) so
        tool calls appear in the same trace."
      - "Review under the deployment's Data exploration, Tracing view."

  - mitigation_type: deployment_notification
    title: Human oversight notification
    default_severity: high
    structural: true
    datarobot_feature: DataRobot deployment notification policies
    remediation: Configure a DataRobot notification policy on the deployment so a human is alerted when this system needs
      attention.
    evidence: Alerting/notification wiring (a notification policy, alert hooks, paging integration) tied to the system's health
      or decisions, in code or DataRobot deployment configuration.
    files_glob: ["**/infra/**", "**/*.yaml", "**/notif*", "**/alert*", "**/__main__.py"]
    iac_evidence: a datarobot.NotificationPolicy resource (Pulumi) whose related entity is the deployment
    fix:
      via: pulumi
      requires: deployment
      hint: "datarobot.NotificationChannel + datarobot.NotificationPolicy attached to the deployment (at least one active
        policy)."
      fix_risk: plumbing
    docs_topic: Configure deployment notifications
    steps:
      - "Make sure the model or LLM path is a datarobot.Deployment."
      - "Pulumi: create a datarobot.NotificationChannel (email or webhook) and a datarobot.NotificationPolicy bound to the
        deployment for service-health, drift and accuracy events."
      - "Console alternative: deployment, Notifications tab, add a policy and channel."

  - mitigation_type: risk_description_filled
    title: Risk classification documented
    default_severity: high
    structural: true
    datarobot_feature: The risk-management RiskAssessment record itself
    remediation: Create and complete a RiskAssessment for this system in DataRobot risk-management, documenting its risk description
      and classification.
    evidence: A documented risk description/classification for this system (risk tier, rationale) in the repo's documentation.
    files_glob: ["**/*.md", "**/docs/**"]
    fix:
      via: api
      hint: "Fill the risk description on the system's RiskAssessment in DataRobot risk-management (console/API)."
    docs_topic: Assess risk
    steps:
      - "In Workbench open the Use Case, Risk tab, and create a risk assessment for this system."
      - "Fill the risk description and classification (probability and impact) and link the mitigations in this report."
      - "Revisit it after material changes; risk assessments are expected to be updated periodically."

  - mitigation_type: rbac
    title: Access control
    default_severity: high
    structural: true
    datarobot_feature: DataRobot's RBAC/permissions system (org roles, permission scoping on deployments and registered models)
    remediation: Manage access to this system through DataRobot's RBAC instead of custom, bespoke authorization code.
    evidence: Real authorization enforcement (role checks, permission scoping) on the system's entry points, or reliance on
      DataRobot's RBAC via platform deployment.
    files_glob: ["**/auth*", "**/*auth*", "**/permission*", "**/*.py", "**/__main__.py"]
    iac_evidence: a datarobot.Deployment resource (Pulumi) places the system under platform RBAC
    fix:
      via: automatic
      hint: "DataRobot RBAC governs every deployment and registered model by construction; deploying through DataRobot satisfies
        this."
    docs_topic: Roles and permissions
    steps:
      - "Deploy through DataRobot; access to the deployment and application is then governed by DataRobot roles and sharing."
      - "Share the deployment and application only with the groups that need them, at the least-privileged role."

  - mitigation_type: prompt_injection_guard
    title: Prompt-injection defense
    default_severity: high
    structural: true
    datarobot_feature: DataRobot's GenAI Guard framework (prompt-injection guard)
    remediation: Attach DataRobot's prompt-injection guard to the deployment instead of relying on a custom defense in the
      agent's own code.
    evidence: A prompt-injection defense on model-bound input, in code or DataRobot guard configuration. A guard configuration
      or input screening before the LLM call satisfies it. System-prompt instructions that tell the model to treat retrieved
      or user content as data and ignore embedded instructions count as evidence too, at reduced confidence, since they are
      the weakest form of the defense.
    files_glob: ["**/guard*", "**/moderation*", "**/*prompt*", "**/system_prompt*", "**/*.py", "**/*.yaml", "**/__main__.py"]
    iac_evidence: a guard_configurations entry on datarobot.CustomModel (Pulumi) using the standard prompt-injection template
    fix:
      via: pulumi
      requires: custom_model
      hint: "datarobot.CustomModel: guard_configurations using the standard prompt-injection guard template (stages + intervention)."
      fix_risk: business_logic
    docs_topic: Configure evaluation and moderation
    steps:
      - "Put the LLM path behind a datarobot.CustomModel (target type Text Generation) with a datarobot.Deployment; a CustomApplication
        alone has no guard attachment point."
      - "Pulumi: add a guard_configurations entry on the CustomModel using the prompt-injection guard template, applied at
        the prompt stage with the intervention (block or report) the policy requires."
      - "Console alternative: Registry, model workshop, Evaluation and moderation, add the prompt-injection guard, then redeploy."

  - mitigation_type: jailbreak_compliance_test
    title: Jailbreak-resistance testing
    default_severity: high
    structural: true
    datarobot_feature: DataRobot's LLM evaluation/compliance test suite (jailbreak-resistance test)
    remediation: Run this system through DataRobot's jailbreak compliance test suite before relying on ad hoc, self-run red-teaming.
    evidence: A jailbreak/red-team evaluation suite that actually runs (eval configs, adversarial test cases), or DataRobot
      compliance-test configuration.
    files_glob: ["**/eval*", "**/test*", "**/*.yaml", "**/docs/**"]
    fix:
      via: api
      hint: "Build the model from an LLM blueprint and run the jailbreak test in its LLM test suite (Use Case playground /
        GenAI API); no Pulumi resource."
    docs_topic: Use LLM evaluation tools
    steps:
      - "Build the LLM as a blueprint in a Use Case playground, or register the deployed model there."
      - "Open the playground evaluation tools, run the jailbreak-resistance test against an evaluation dataset, and record
        the result."
      - "Attach the result to the Use Case risk assessment as evidence for this mitigation."

  - mitigation_type: ai_literacy
    title: Staff AI literacy
    default_severity: medium
    structural: false
    datarobot_feature: None, this is an organizational requirement DataRobot does not automate.
    remediation: Establish an AI literacy training program for the staff operating this system. Not something a code or platform
      migration satisfies.
    evidence: Not assessable from a repository; this is an organizational/staff-training requirement.
    files_glob: []
    fix:
      via: organizational
      hint: "Confirmed by a policy admin in DataRobot risk-management; a staff-training program, not a repo change."
    docs_topic: Assess risk
    steps:
      - "Confirm with the policy admin that a staff AI-literacy program exists and record it on the Use Case risk assessment;
        there is no repo change for this mitigation."

