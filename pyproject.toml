[project]
name = "datarobot-agent-skills"
version = "0.0.1"
description = "DataRobot agent skills"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff==0.15.22",
]
integration = [
    "datarobot-predict",
    "datarobot-genai",
    # Required by test_sdk_conformance.py: skills are validated against the real SDK.
    "datarobot>=3.19",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "codeowners>=0.8.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]
e2e = [
    "datarobot-agent-tester @ git+https://github.com/datarobot-oss/datarobot-agent-tester@a6b67a15862c27cc0af46abf97d47a96fdf92809",
    "python-dotenv>=1.2.2",
    "pytest",
    "pytest-asyncio",
]
behavioral = [
    # Behavioral test engine (agent driver, DataRobot outcome checks, teardown).
    # Pinned to the head of datarobot-oss/datarobot-agent-tester#11 (the engine
    # PR; not yet merged). Once it merges and the engine cuts a release tag,
    # replace this with the tag (then a PyPI `==` pin). The e2e group pins an
    # older engine commit, so the two groups are declared conflicting below
    # and are only ever installed separately. For local development against
    # an engine checkout: uv pip install -e '../datarobot-agent-tester[behavioral]'
    "datarobot-agent-tester[behavioral] @ git+https://github.com/datarobot-oss/datarobot-agent-tester@13bde1382a398618b2f07db299596d54a5e7a85f",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# e2e and behavioral pin different engine commits; never install both at once.
conflicts = [[{ group = "e2e" }, { group = "behavioral" }]]

[tool.pytest.ini_options]

[tool.mypy]
# The strategy moving forward is to delete these one by one and get the errors back to zero.
exclude = [
    "skills/datarobot-data-preparation",
    "skills/datarobot-predictions",
    "skills/datarobot-model-training",
    "skills/datarobot-external-agent-monitoring",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = "ignore-without-code"
implicit_reexport = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
